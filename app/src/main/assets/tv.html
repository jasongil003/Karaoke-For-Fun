<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videoke Night</title>
<style>
  :root { --bg:#0b0b12; --panel:#15151f; --muted:#9a9ab0; --text:#f4f4fa; --accent:#ff3d7f; --accent2:#ffb347; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:var(--bg); color:var(--text);
    font-family: "Roboto", system-ui, sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0; display:flex; }
  #playerWrap { flex:1; position:relative; background:#000; }
  #player { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #side { width:25%; min-width:300px; background:var(--panel); padding:16px 18px; display:flex; flex-direction:column;
    gap:10px; transition: margin-right .3s; overflow:hidden; }
  #side .qrBox { padding:6px; border-radius:10px; }
  #side .qrBox img { width:110px; height:110px; }
  #side .brand { font-size:20px; }
  #side .scan { font-size:14px; }
  #side .now { padding:10px 12px; }
  #side .now .singer { font-size:18px; }
  #side .now .title { font-size:13px; }
  body.noSide #side { margin-right:-25%; min-width:0; width:0; padding:0; overflow:hidden; }
  .brand { font-size:26px; font-weight:800; letter-spacing:.5px; }
  .brand span { color:var(--accent); }
  .qrBox { background:#fff; border-radius:14px; padding:10px; align-self:center; }
  .qrBox img { display:block; width:190px; height:190px; }
  .scan { text-align:center; font-size:17px; color:var(--muted); line-height:1.35; }
  .scan b { color:var(--text); }
  h3 { font-size:14px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  .now { background:linear-gradient(135deg, rgba(255,61,127,.25), rgba(255,179,71,.15)); border-radius:12px; padding:14px; }
  .now .singer { font-size:22px; font-weight:700; }
  .now .title { font-size:15px; color:#ddd; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  ol { list-style:none; display:flex; flex-direction:column; gap:10px; overflow:hidden; flex:1; }
  li { display:flex; gap:12px; align-items:center; }
  li .n { width:28px; height:28px; border-radius:50%; background:#2a2a3a; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; flex:none; }
  li .who { font-weight:700; font-size:16px; }
  li .what { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
  .empty { color:var(--muted); font-size:15px; }
  .keys { font-size:12px; color:#6f6f88; line-height:1.5; }
  /* Idle screen */
  #idle { position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:70px;
    background: radial-gradient(circle at 30% 30%, #2a0f2a 0%, var(--bg) 60%); }
  body.idle #idle { display:flex; }
  #idle h1 { font-size:64px; font-weight:900; line-height:1.05; }
  #idle h1 span { color:var(--accent); }
  #idle p { font-size:26px; color:#cfcfe0; margin-top:18px; line-height:1.4; }
  #idle .url { font-size:20px; color:var(--accent2); margin-top:14px; }
  #idle .qrBox img { width:320px; height:320px; }
  /* Banner when a new singer starts */
  #banner { position:absolute; left:50%; top:40px; transform:translate(-50%, -150%); background:rgba(0,0,0,.8);
    border:2px solid var(--accent); border-radius:999px; padding:16px 34px; font-size:30px; font-weight:800;
    transition: transform .5s, opacity .5s; white-space:nowrap; z-index:5; opacity:0; }
  #banner.show { transform:translate(-50%, 0); opacity:1; }
  #pausedTag { position:absolute; left:24px; bottom:24px; background:rgba(0,0,0,.75); padding:10px 20px; border-radius:10px;
    font-size:24px; font-weight:700; display:none; z-index:5; }
  body.paused #pausedTag { display:block; }
</style>
</head>
<body class="idle">
<div id="stage">
  <div id="playerWrap"><div id="player"></div><div id="banner"></div><div id="pausedTag">⏸ Paused</div></div>
  <aside id="side">
    <div class="brand">🎤 Videoke <span>Night</span></div>
    <div class="qrBox"><img class="qr" alt="QR code"></div>
    <div class="scan">Scan to <b>add a song</b><br><small class="urlText"></small></div>
    <div>
      <h3>Now singing</h3>
      <div class="now"><div class="singer" id="nowSinger">—</div><div class="title" id="nowTitle"></div></div>
    </div>
    <h3>Up next</h3>
    <ol id="next"></ol>
    <div class="keys">OK: pause/play · ▶ Right: skip · ▲▼: hide/show this panel</div>
  </aside>
</div>
<div id="idle">
  <div>
    <h1>🎤 Videoke<br><span>Night</span></h1>
    <p>Scan the code with your phone camera,<br>pick a song, and get in line!</p>
    <p style="font-size:20px;color:#9a9ab0">Phones must be on this home Wi-Fi.</p>
    <div class="url urlText"></div>
  </div>
  <div class="qrBox"><img class="qr" alt="QR code"></div>
</div>

<script>
let player = null, playerReady = false, loadedSongId = 0, lastVersion = 0, state = null, bannerTimer = null;

function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function post(path, body) {
  try {
    const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
    return await r.json();
  } catch (e) { return null; }
}

function render(st) {
  document.body.classList.toggle('idle', !st.current);
  document.body.classList.toggle('paused', !!st.paused);
  document.querySelectorAll('.urlText').forEach(el => el.textContent = st.url || 'Connect the TV to Wi-Fi');
  document.getElementById('nowSinger').textContent = st.current ? st.current.singer : '—';
  document.getElementById('nowTitle').textContent = st.current ? st.current.title : '';
  const ol = document.getElementById('next');
  ol.innerHTML = st.upcoming.length ? st.upcoming.slice(0, 8).map((s, i) =>
    `<li><div class="n">${i + 1}</div><div><div class="who">${esc(s.singer)}</div><div class="what">${esc(s.title)}</div></div></li>`).join('')
    : '<div class="empty">No one in line yet. Scan the code!</div>';
}

function showBanner(text) {
  const b = document.getElementById('banner');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 6000);
}

function syncPlayer(st) {
  if (!playerReady) return;
  const cur = st.current;
  if (!cur) {
    if (loadedSongId) { player.stopVideo(); loadedSongId = 0; }
    return;
  }
  if (cur.id !== loadedSongId) {
    loadedSongId = cur.id;
    player.loadVideoById(cur.videoId);
    showBanner('🎤 Now singing: ' + cur.singer);
    return;
  }
  const ps = player.getPlayerState();
  if (st.paused && ps === YT.PlayerState.PLAYING) player.pauseVideo();
  if (!st.paused && ps === YT.PlayerState.PAUSED) player.playVideo();
}

async function poll() {
  try {
    const st = await (await fetch('/api/state')).json();
    state = st;
    if (st.version !== lastVersion) { lastVersion = st.version; render(st); }
    syncPlayer(st);
  } catch (e) { }
  setTimeout(poll, 1200);
}

function songEnded() {
  if (state && state.current) post('/api/next', { id: state.current.id });
}

window.remote = function (cmd) {
  if (cmd === 'pause') post('/api/pause');
  else if (cmd === 'skip') songEnded();
  else if (cmd === 'toggleQr') document.body.classList.toggle('noSide');
};

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3,
                  origin: location.origin },
    events: {
      onReady: () => { playerReady = true; if (state) syncPlayer(state); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) songEnded(); },
      // 2, 5, 100, 101, 150: bad id, HTML5 error, removed, or the owner blocks playback outside YouTube. Skip it.
      onError: () => {
        if (state && state.current) post('/api/bad', { videoId: state.current.videoId });
        showBanner('⚠️ That video can\'t play here, skipping…');
        setTimeout(songEnded, 3000);
      }
    }
  });
};

document.querySelectorAll('.qr').forEach(img => img.src = '/qr.png?' + Date.now());
setInterval(() => document.querySelectorAll('.qr').forEach(img => img.src = '/qr.png?' + Date.now()), 60000);
poll();
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
</body>
</html>
