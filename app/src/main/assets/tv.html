<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke For Fun</title>
<style>
  :root { --bg:#0b0a12; --pink:#ff3d7f; --orange:#ffa94d; --text:#f6f4fb; --muted:#b8b3c8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:#000; color:var(--text); overflow:hidden;
    font-family:"Roboto", system-ui, sans-serif; }
  #player { position:absolute; inset:0; width:100%; height:100%; border:0; }

  .glass { background:rgba(12,10,20,.78); border:1px solid rgba(255,255,255,.12); border-radius:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }

  /* Idle: nobody singing */
  #idle { position:absolute; inset:0; display:none; align-items:center; justify-content:center; gap:80px; z-index:4;
    background:radial-gradient(circle at 25% 30%, #3a0f2e 0%, var(--bg) 60%); }
  body.idle #idle { display:flex; }
  #waiting { display:none; margin-top:26px; padding:16px 22px; font-size:24px; line-height:1.45; border-color:rgba(255,61,127,.5); }
  #waiting span { font-size:19px; color:var(--muted); }
  #idle h1 { font-size:66px; font-weight:900; line-height:1.02; letter-spacing:-1px; }
  #idle h1 span { background:linear-gradient(90deg, var(--pink), var(--orange)); -webkit-background-clip:text; color:transparent; }
  #idle p { font-size:26px; color:#d9d4e6; margin-top:20px; line-height:1.4; }
  #idle .hint { font-size:19px; color:var(--muted); margin-top:12px; }
  #idle .url { font-size:20px; color:var(--orange); margin-top:16px; }
  .qrimg { background:#fff; border-radius:18px; padding:14px; }
  .qrimg img { display:block; }
  #idle .qrimg img { width:330px; height:330px; }

  /* Small QR only, top-right corner, shown on a schedule (kept away from the lyrics) */
  #qrCard { position:absolute; right:22px; top:22px; z-index:6; padding:6px; border-radius:10px; background:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.5); opacity:0; transform:scale(.6); transform-origin:top right;
    transition:opacity .5s, transform .5s cubic-bezier(.2,.9,.3,1.2); }
  #qrCard.show { opacity:1; transform:none; }
  #qrCard img { display:block; width:96px; height:96px; }

  /* Now singing banner */
  #banner { position:absolute; left:50%; top:36px; z-index:6; padding:16px 34px; display:flex; align-items:center; gap:14px;
    transform:translate(-50%, -160%); opacity:0; transition:transform .6s cubic-bezier(.2,.9,.3,1.1), opacity .4s; white-space:nowrap; }
  #banner.show { transform:translate(-50%, 0); opacity:1; }
  #banner .mic { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:24px;
    background:linear-gradient(135deg, var(--pink), var(--orange)); }
  #banner small { display:block; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:#ffc7da; }
  #banner b { font-size:30px; font-weight:800; }

  /* Up next popup */
  #upnext { position:absolute; left:32px; bottom:32px; z-index:6; display:flex; align-items:center; gap:16px; padding:14px 22px 14px 14px;
    max-width:56%; transform:translateX(-130%); transition:transform .6s cubic-bezier(.2,.9,.3,1.1); }
  #upnext.show { transform:none; }
  #upnext img { width:128px; height:72px; object-fit:cover; border-radius:12px; background:#000; flex:none; }
  #upnext small { display:block; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:700; }
  #upnext b { display:block; font-size:28px; font-weight:800; margin-top:2px; }
  #upnext span { display:block; font-size:16px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #upnext .count { font-size:15px; color:#fff; margin-top:6px; }

  /* Pause overlay */
  #paused { position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:flex-start; flex-direction:column; gap:18px;
    padding-top:16vh; background:rgba(0,0,0,.55); }
  body.paused:not(.idle) #paused { display:flex; }
  #paused .ring { width:150px; height:150px; border-radius:50%; display:grid; place-items:center;
    background:rgba(255,255,255,.12); border:3px solid rgba(255,255,255,.6); }
  #paused .ring i { display:flex; gap:20px; } #paused .ring i::before, #paused .ring i::after { content:""; width:22px; height:66px; border-radius:6px; background:#fff; }
  #paused p { font-size:26px; font-weight:700; } #paused small { font-size:18px; color:var(--muted); }

  /* "Great job!" outro: fully covers the video's last seconds (and YouTube's end-screen suggestions) */
  #outro { position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .8s;
    background:radial-gradient(circle at 50% 40%, #4a1239 0%, #120a1a 55%, #07060b 100%); }
  #outro.show { opacity:1; }
  #outro .clap { font-size:110px; animation:clap .6s ease-in-out infinite alternate; }
  @keyframes clap { to { transform:scale(1.12) rotate(-6deg); } }
  #outro h2 { font-size:64px; font-weight:900; margin-top:10px; letter-spacing:-1px; }
  #outro h2 span { background:linear-gradient(90deg, var(--pink), var(--orange)); -webkit-background-clip:text; color:transparent; }
  #outro p { font-size:26px; color:var(--muted); margin-top:10px; }
  #outro .next { margin-top:44px; display:flex; align-items:center; gap:18px; padding:16px 26px 16px 16px; text-align:left; }
  #outro .next img { width:150px; height:84px; object-fit:cover; border-radius:12px; background:#000; }
  #outro .next small { display:block; font-size:15px; letter-spacing:2px; text-transform:uppercase; color:var(--orange); font-weight:700; }
  #outro .next b { display:block; font-size:32px; font-weight:800; }
  #outro .next span { display:block; font-size:17px; color:var(--muted); max-width:640px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .confetti { position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(720deg); } }

  /* Quick action feedback */
  #flash { position:absolute; left:50%; top:50%; z-index:7; transform:translate(-50%,-50%) scale(.8); opacity:0; pointer-events:none;
    padding:22px 40px; font-size:34px; font-weight:800; transition:transform .25s, opacity .25s; }
  #flash.show { transform:translate(-50%,-50%) scale(1); opacity:1; }

  /* Thin progress line along the bottom */
  #bar { position:absolute; left:0; bottom:0; height:5px; z-index:6; background:linear-gradient(90deg, var(--pink), var(--orange));
    width:0; transition:width 1s linear; }
  body.idle #bar { display:none; }
</style>
</head>
<body class="idle">
<div id="player"></div>
<div id="bar"></div>

<div id="idle">
  <div>
    <h1>🎤 Karaoke<br><span>For Fun</span></h1>
    <p>Scan the code with your phone camera,<br>pick a song, and get in line!</p>
    <div class="hint">Phones must be on this home Wi-Fi.</div>
    <div class="url urlText"></div>
    <div id="waiting" class="glass"></div>
  </div>
  <div class="qrimg"><img class="qr" alt="QR code"></div>
</div>

<div id="banner" class="glass"><div class="mic">🎤</div><div><small>Now singing</small><b id="bannerName"></b></div></div>

<div id="upnext" class="glass">
  <img id="upThumb" alt="">
  <div style="min-width:0"><small>Up next · get ready!</small><b id="upName"></b><span id="upTitle"></span><div class="count" id="upCount"></div></div>
</div>

<div id="qrCard"><img class="qr" alt="QR code"></div>

<div id="paused"><div class="ring"><i></i></div><p>Paused</p><small id="pausedBy"></small><small>Press OK on the remote to continue</small></div>
<div id="flash" class="glass"></div>

<div id="outro">
  <div class="clap">👏</div>
  <h2>Great job, <span id="outroName"></span>!</h2>
  <p id="outroSub">Give it up for our singer!</p>
  <div class="next glass" id="outroNext">
    <img id="outroThumb" alt="">
    <div style="min-width:0"><small>Up next · get ready!</small><b id="outroNextName"></b><span id="outroNextTitle"></span></div>
  </div>
</div>

<script>
// ---- Settings ----
const QR_EVERY_MIN = 5;        // show the QR card every N minutes during a song
const QR_SHOW_SEC = 20;        // ...for this many seconds
const QR_AT_START_SEC = 20;    // and for the first N seconds of every song
const UPNEXT_SEC = 25;         // pop up "Up next" in the last N seconds of a song
const EMPTY_LINE_SEC = 90;     // if nobody is in line, keep the QR up for the last N seconds
const END_EARLY_SEC = 12;      // finish this many seconds before the video ends, so YouTube's end-screen
                               // suggestions never show (it's usually just the instrumental outro)
const OUTRO_SEC = 5;           // how long the "Great job!" screen stays while the music fades

let player = null, playerReady = false, loadedSongId = 0, lastVersion = 0, state = null;
let seenRestart = null, appliedVolume = null, songStartedAt = 0, manualQrUntil = 0;
let outroFor = 0, outroTimer = null, fadeTimer = null;
const $ = id => document.getElementById(id);

async function post(path, body) {
  try {
    const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
    return await r.json();
  } catch (e) { return null; }
}

let bannerTimer, flashTimer;
function showBanner(name) {
  $('bannerName').textContent = name;
  $('banner').classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => $('banner').classList.remove('show'), 7000);
}
function flash(text) {
  $('flash').textContent = text; $('flash').classList.add('show');
  clearTimeout(flashTimer); flashTimer = setTimeout(() => $('flash').classList.remove('show'), 1400);
}

function render(st) {
  document.body.classList.toggle('idle', !st.current || st.held);
  const waiting = st.held ? st.upcoming.length + 1 : 0;
  $('waiting').style.display = waiting ? 'block' : 'none';
  $('waiting').innerHTML = waiting
    ? `🎶 <b>${waiting} song${waiting > 1 ? 's' : ''}</b> waiting in line<br><span>Press <b>OK</b> on the remote or <b>Start</b> on a phone to begin</span>` : '';
  document.body.classList.toggle('paused', !!st.paused);
  $('pausedBy').textContent = st.paused && st.pausedBy ? 'Paused by ' + st.pausedBy : '';
  document.querySelectorAll('.urlText').forEach(el => el.textContent = st.url || 'Connect the TV to Wi-Fi');
  const n = st.upcoming[0];
  if (n) {
    $('upName').textContent = n.singer;
    $('upTitle').textContent = n.title;
    $('upThumb').src = n.thumb || '';
    $('upCount').textContent = st.upcoming.length > 1 ? `+${st.upcoming.length - 1} more in line` : '';
  }
}

function syncPlayer(st) {
  if (!playerReady) return;
  if (appliedVolume !== st.volume && !outroFor) { player.setVolume(st.volume); appliedVolume = st.volume; }
  const cur = st.held ? null : st.current;   // a held line (after startup) doesn't play yet
  if (!cur) {
    if (loadedSongId) { player.stopVideo(); loadedSongId = 0; }
    return;
  }
  if (cur.id !== loadedSongId) {
    endOutro();
    loadedSongId = cur.id;
    seenRestart = st.restartSeq;
    songStartedAt = Date.now();
    player.loadVideoById(cur.videoId);
    showBanner(cur.singer);
    return;
  }
  if (seenRestart !== st.restartSeq) {
    seenRestart = st.restartSeq;
    endOutro();
    player.seekTo(0, true); player.playVideo();
    songStartedAt = Date.now();
    flash('⏮ From the top!');
  }
  const ps = player.getPlayerState();
  if (st.paused && ps === YT.PlayerState.PLAYING) player.pauseVideo();
  if (!st.paused && ps === YT.PlayerState.PAUSED) player.playVideo();
}

// Decide what pops up: the corner QR card and the "up next" card.
function overlays() {
  const st = state;
  let showQr = false, showNext = false, head = 'Want to sing?', sub = 'Scan with your phone camera to add a song';
  if (st && st.current && !st.held && playerReady) {
    const pos = player.getCurrentTime ? player.getCurrentTime() : 0;
    const dur = player.getDuration ? player.getDuration() : 0;
    const left = dur > 0 ? dur - pos : Infinity;
    const sinceStart = (Date.now() - songStartedAt) / 1000;
    const minute = Math.floor(sinceStart);
    if (sinceStart < QR_AT_START_SEC) showQr = true;
    if (minute >= QR_EVERY_MIN * 60 && (minute % (QR_EVERY_MIN * 60)) < QR_SHOW_SEC) showQr = true;
    if (left <= UPNEXT_SEC && st.upcoming.length) { showNext = true; showQr = false; }
    if (dur > 60 && left <= END_EARLY_SEC && !st.paused && outroFor !== st.current.id) startOutro(st);
    if (outroFor) { showNext = false; showQr = false; }
    if (left <= EMPTY_LINE_SEC && !st.upcoming.length) {
      showQr = true; head = 'Nobody is next!'; sub = 'Scan now to sing the next song';
    }
    $('bar').style.width = dur > 0 ? (100 * pos / dur).toFixed(2) + '%' : '0';
  }
  if (Date.now() < manualQrUntil) showQr = true;
  if (st && st.paused) showQr = true;
  $('qrCard').classList.toggle('show', showQr && !!(st && st.current && !st.held));
  $('upnext').classList.toggle('show', showNext);
}

async function poll() {
  try {
    const st = await (await fetch('/api/state')).json();
    state = st;
    if (st.version !== lastVersion) { lastVersion = st.version; render(st); }
    syncPlayer(st);
  } catch (e) { }
  setTimeout(poll, 1000);
}

// Tell the phones where the song is, for their progress bar.
setInterval(() => {
  if (!playerReady || !state || !state.current) return;
  post('/api/progress', { id: state.current.id, pos: player.getCurrentTime() || 0, dur: player.getDuration() || 0 });
}, 2000);
setInterval(overlays, 500);

// Cover the last seconds with our own "Great job!" screen, fade the music out, then go to the next song.
function startOutro(st) {
  const cur = st.current, n = st.upcoming[0];
  outroFor = cur.id;
  $('outroName').textContent = cur.singer;
  $('outroSub').textContent = n ? 'Give it up for our singer!' : 'Scan the QR code to sing the next one!';
  $('outroNext').style.display = n ? 'flex' : 'none';
  if (n) { $('outroNextName').textContent = n.singer; $('outroNextTitle').textContent = n.title; $('outroThumb').src = n.thumb || ''; }
  $('outro').classList.add('show');
  confetti();
  const startVol = st.volume, steps = 16;
  let i = 0;
  clearInterval(fadeTimer);
  fadeTimer = setInterval(() => {
    i++;
    if (playerReady) player.setVolume(Math.max(0, Math.round(startVol * (1 - i / steps))));
    if (i >= steps) clearInterval(fadeTimer);
  }, (OUTRO_SEC * 1000 - 600) / steps);
  appliedVolume = null;   // the next song puts the real volume back
  clearTimeout(outroTimer);
  outroTimer = setTimeout(() => {
    if (state && state.current && state.current.id === cur.id) post('/api/next', { id: cur.id });
    if (!n) { player.stopVideo(); setTimeout(endOutro, 600); }
  }, OUTRO_SEC * 1000);
}

function endOutro() {
  if (!outroFor) return;
  outroFor = 0;
  clearTimeout(outroTimer); clearInterval(fadeTimer);
  appliedVolume = null;
  $('outro').classList.remove('show');
  document.querySelectorAll('.confetti').forEach(c => c.remove());
}

function confetti() {
  const colors = ['#ff3d7f', '#ffa94d', '#3ddc97', '#5cc8ff', '#ffe066', '#c77dff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    c.style.animationDelay = (Math.random() * 1.2) + 's';
    $('outro').appendChild(c);
  }
}

function songEnded() {
  if (state && state.current) post('/api/next', { id: state.current.id });
}

window.remote = function (cmd, by) {
  if (state && state.held) { if (cmd === 'pause' || cmd === 'play') post('/api/start'); return; }
  if (!state || !state.current) { if (cmd === 'toggleQr') manualQrUntil = 0; return; }
  if (cmd === 'pause') post('/api/pause', { mode: 'toggle', by: by || 'Remote' });
  else if (cmd === 'play') post('/api/pause', { mode: 'play', by: by || 'Remote' });
  else if (cmd === 'hold') post('/api/pause', { mode: 'pause', by: by || 'Remote' });
  else if (cmd === 'skip') { flash('⏭ Skipping…'); songEnded(); }
  else if (cmd === 'restart') post('/api/restart');
  else if (cmd === 'toggleQr') manualQrUntil = Date.now() < manualQrUntil ? 0 : Date.now() + 30000;
};

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0,
                  disablekb: 1, origin: location.origin },
    events: {
      onReady: () => { playerReady = true; if (state) syncPlayer(state); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) songEnded(); },
      // 2, 5, 100, 101, 150: bad id, HTML5 error, removed, or blocked outside YouTube. Skip and remember it.
      onError: () => {
        if (state && state.current) post('/api/bad', { videoId: state.current.videoId });
        flash('⚠️ Can\'t play this one — skipping');
        setTimeout(songEnded, 2500);
      }
    }
  });
};

function refreshQr() { document.querySelectorAll('.qr').forEach(img => img.src = '/qr.png?' + Date.now()); }
refreshQr(); setInterval(refreshQr, 60000);
poll();
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
</body>
</html>
